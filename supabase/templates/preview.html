      font-weight: 600;

      font-family: inherit;

      background: #ff7e36;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(255, 126, 54, 0.4);

      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);

    .copy-btn:hover {
      background: #16a34a;
    }
    .container {
      display: flex;
      height: calc(100vh - 73px);
    }
    .preview-pane {
      flex: 1;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-y: auto;
    }
    iframe {
      width: 100%;
      max-width: 640px;
      height: 750px;
      border: none;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      background: #ffffff;

    .code-pane {

      background: #0f172a;
      font-weight: 600;
      font-size: 14px;
      color: #94a3b8;
      border-bottom: 1px solid #334155;

      background: #0f172a;
      color: #38bdf8;
      border: none;
      padding: 16px;
      font-family: monospace;
      font-size: 12px;

    let currentTab = 'confirm';

    function loadTemplate(key) {
      const frame = document.getElementById('preview-frame');
      const box = document.getElementById('code-box');
      const rawHtml = templates[key];
      
      // For local iframe preview replace {{ .SiteURL }} with local public relative path
      const previewHtml = rawHtml.replace(/\{\{\s*\.SiteURL\s*\}\}/g, '../../public');
      
      frame.srcdoc = previewHtml;
      box.value = rawHtml;
    }

    function switchTab(key) {
      currentTab = key;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      loadTemplate(key);
    }

    function copyHTML() {
      const box = document.getElementById('code-box');
      box.select();
      navigator.clipboard.writeText(box.value);
      alert('📋 คัดลอก HTML พร้อมโลโก้ logo2.png เรียบร้อยแล้ว! สามารถนำไปวางใน Supabase Email Template ได้ทันที');
    }
